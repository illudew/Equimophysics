<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Equimophysics · 量子力学（一）期末复习</title>

<style>
:root{
  --bg:#080808; --panel:#111; --panel2:#161616; --border:#272727;
  --text:#f2f2f2; --muted:#8a8a8a; --green:#b7ff4a; --yellow:#ffd84d;
  --red:#ff6464; --blue:#65a7ff;
}
*{box-sizing:border-box;}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;}
.app{display:flex;min-height:100vh;}

/* 侧边栏 */
.sidebar{
  width:240px;border-right:1px solid var(--border);padding:26px 18px;
  position:fixed;top:0;bottom:0;background:#090909;overflow-y:auto;
}
.logo{font-size:21px;font-weight:700;letter-spacing:-0.8px;margin-bottom:6px;}
.logo span{color:var(--green);}
.tagline{font-size:9px;color:var(--muted);letter-spacing:1.5px;margin-bottom:30px;line-height:1.6;}
.nav-label{color:#555;font-size:9px;letter-spacing:1.5px;margin:20px 0 8px;}
.nav button{
  display:block;width:100%;background:none;border:none;color:#8a8a8a;
  padding:10px 10px;text-align:left;border-radius:6px;cursor:pointer;font-size:13px;margin-bottom:2px;
}
.nav button:hover{background:#161616;color:#fff;}
.nav button.active{background:#171717;color:#fff;border-left:2px solid var(--green);}

/* 主区 */
.main{margin-left:240px;width:calc(100% - 240px);padding:34px 46px 90px;max-width:1420px;}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:34px;}
.page-title{font-size:11px;color:var(--muted);letter-spacing:2px;}
.profile{width:30px;height:30px;border:1px solid #333;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;}

.hero{margin-bottom:32px;}
.hero-label{color:var(--green);font-size:10px;letter-spacing:2px;margin-bottom:12px;}
.hero h1{font-size:clamp(28px,4vw,46px);line-height:1.05;letter-spacing:-1.5px;margin:0 0 16px;max-width:880px;}
.hero p{color:#8a8a8a;max-width:760px;font-size:13.5px;line-height:1.8;margin:0;}

.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:22px;margin-bottom:16px;}
.card-title{font-size:10px;letter-spacing:1.5px;color:#777;margin-bottom:16px;}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:start;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}

/* 信息表 */
.kv{display:flex;font-size:12.5px;padding:8px 0;border-bottom:1px solid #1d1d1d;}
.kv:last-child{border-bottom:none;}
.kv b{color:#777;font-weight:400;width:96px;flex:none;}
.kv span{color:#ddd;}

/* 标签 */
.tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:5px;border:1px solid #2c2c2c;color:#aaa;margin:2px 4px 2px 0;background:#161616;}
.tag.t-s{color:var(--green);border-color:rgba(183,255,74,.35);background:rgba(183,255,74,.07);}
.tag.t-a{color:var(--yellow);border-color:rgba(255,216,77,.3);background:rgba(255,216,77,.07);}
.tag.t-b{color:var(--blue);border-color:rgba(101,167,255,.3);background:rgba(101,167,255,.07);}
.tag.t-c{color:#999;}
.tag.t-d{color:#666;}

.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:700;}
.badge.s{background:rgba(183,255,74,.12);color:var(--green);border:1px solid rgba(183,255,74,.35);}
.badge.a{background:rgba(255,216,77,.12);color:var(--yellow);border:1px solid rgba(255,216,77,.3);}
.badge.b{background:rgba(101,167,255,.12);color:var(--blue);border:1px solid rgba(101,167,255,.3);}
.badge.c{background:#1c1c1c;color:#999;border:1px solid #2c2c2c;}
.badge.d{background:#141414;color:#666;border:1px solid #242424;}

.stars{color:var(--yellow);font-size:11px;letter-spacing:1px;}

/* 表格 */
.tbl{width:100%;border-collapse:collapse;}
.tbl th,.tbl td{text-align:left;border-bottom:1px solid #1f1f1f;padding:12px 8px;font-size:12.5px;vertical-align:top;}
.tbl th{color:#666;font-weight:400;font-size:10px;letter-spacing:1px;}
.tbl td{color:#ccc;}
.tbl tr:hover td{background:#131313;}

/* 章节手风琴 */
details.ch{background:var(--panel);border:1px solid var(--border);border-radius:10px;margin-bottom:12px;overflow:hidden;}
details.ch>summary{
  cursor:pointer;padding:18px 22px;list-style:none;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
details.ch>summary::-webkit-details-marker{display:none;}
details.ch>summary::before{content:"▸";color:var(--green);font-size:12px;transition:.15s;}
details.ch[open]>summary::before{transform:rotate(90deg);}
details.ch>summary h3{margin:0;font-size:15px;font-weight:600;}
details.ch>summary .en{color:#5a5a5a;font-size:11px;}
details.ch>summary .src{margin-left:auto;color:#555;font-size:10px;}
.ch-body{padding:4px 22px 22px;border-top:1px solid #1e1e1e;}
.sub-h{color:var(--green);font-size:10px;letter-spacing:1.5px;margin:18px 0 10px;}

.section-list{display:flex;flex-wrap:wrap;gap:6px;}
.section-list span{font-size:11px;color:#999;background:#151515;border:1px solid #222;padding:3px 9px;border-radius:5px;}

.concept{font-size:12.5px;line-height:1.75;color:#b8b8b8;padding:7px 0;border-bottom:1px solid #1a1a1a;}
.concept b{color:#e6e6e6;font-weight:600;}
.concept:last-child{border-bottom:none;}

.fml{display:grid;grid-template-columns:150px 1fr;gap:14px;padding:10px 0;border-bottom:1px solid #1a1a1a;align-items:baseline;}
.fml:last-child{border-bottom:none;}
.fml .fn{font-size:11.5px;color:#8a8a8a;line-height:1.6;}
.fml .ft{font-size:13px;color:#ddd;overflow-x:auto;overflow-y:hidden;}

/* 真题 */
.exam-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px;}
.exam-head h3{margin:0;font-size:16px;}
.q{border-top:1px solid #1e1e1e;padding:16px 0;}
.q-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px;}
.q-no{color:var(--green);font-size:12px;font-weight:700;flex:none;}
.q-title{font-size:13.5px;font-weight:600;}
.q-stem{font-size:12.5px;color:#b0b0b0;line-height:1.75;}
.q-key{font-size:12px;color:#7f9a5f;line-height:1.7;margin-top:6px;}
.q-src{font-size:10.5px;color:#555;margin-top:8px;}

/* 冲刺 */
.plan .t{color:var(--green);font-size:22px;font-weight:700;}
.plan h3{font-size:13px;margin:12px 0 8px;}
.plan p{font-size:11.5px;color:#888;line-height:1.7;margin:0;}

/* 提示 */
.note{border-left:2px solid var(--green);padding:10px 16px;margin:14px 0;color:#9a9a9a;font-size:12px;line-height:1.75;}
.ev{border-left:2px solid #333;padding-left:14px;margin:8px 0;}
.ev div{font-size:11.5px;color:#aaa;margin-bottom:4px;}

@media (max-width:1000px){
  .sidebar{width:72px;padding:22px 8px;}
  .logo{font-size:15px;text-align:center;} .logo span{display:none;}
  .tagline,.nav-label{display:none;}
  .nav button{text-align:center;font-size:11px;padding:10px 3px;}
  .main{margin-left:72px;width:calc(100% - 72px);padding:22px;}
  .grid2,.cols,.grid4{grid-template-columns:1fr;}
  .grid3{grid-template-columns:1fr 1fr;}
  .fml{grid-template-columns:1fr;}
}
@media (max-width:640px){
  .grid3,.grid4{grid-template-columns:1fr;}
  .main{padding:16px;}
}
</style>

          <tr><td>讲义</td><td>chapter01 / 02·02a·02b / 03 / 04 / 05 / 06 / 08 / 09.pdf</td><td>章节结构、核心概念、重要公式</td></tr>

    <div class="card">
      <div class="card-title">处理原则</div>
      <div class="concept"><b>原始文件不改动</b>：所有 PDF 均保持原样，仅在其上做提取与分析。</div>
      <div class="concept"><b>可回溯</b>：每个考点都标注它出现的年份与题号，可回到真题核对。</div>

      <div class="concept"><b>区分不确定信息</b>：三套真题均为“回忆版”，个别系数或题干表述可能与原卷有出入，已在题面中标注。</div>

/* ============ 页面切换 ============ */
const PAGE_NAMES = {dashboard:'总览',chapters:'章节结构',formulas:'公式速查',high:'高频考点',
  types:'高频题型',exams:'历年真题',sprint:'冲刺方案',mistakes:'错题本',about:'数据说明'};

function showPage(id, btn){
  document.querySelectorAll('.page').forEach(p=>p.style.display='none');
  const el=document.getElementById(id); if(el) el.style.display='block';
  const target = btn || document.querySelector('.nav button[data-page="'+id+'"]');
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  if(target) target.classList.add('active');
  $('#pageTitle').innerText = PAGE_NAMES[id]||'';
  window.scrollTo(0,0);
  typeset();
}

/* ============ MathJax 排版 ============ */
function typeset(){
  if(window.MathJax && window.MathJax.typesetPromise){
    window.MathJax.typesetPromise().catch(()=>{});
  }
}

renderDashboard();

(function waitMJ(){
  if(window.MathJax && window.MathJax.typesetPromise){
    window.MathJax.typesetPromise().catch(()=>{});
  } else {
    setTimeout(waitMJ, 250);
  }
})();
