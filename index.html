<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Equimophysics · 期末复习系统</title>

<style>
:root{
  --bg:#080808; --panel:#111; --panel2:#161616; --border:#272727;
  --text:#f2f2f2; --muted:#8a8a8a; --green:#b7ff4a; --yellow:#ffd84d;
  --red:#ff6464; --blue:#65a7ff;
}
*{box-sizing:border-box;}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;}
.app{display:flex;min-height:100vh;}

/* 侧边栏 */
.sidebar{
  width:240px;border-right:1px solid var(--border);padding:26px 18px;
  position:fixed;top:0;bottom:0;background:#090909;overflow-y:auto;
}
.logo{font-size:21px;font-weight:700;letter-spacing:-0.8px;margin-bottom:6px;}
.logo span{color:var(--green);}
.tagline{font-size:9px;color:var(--muted);letter-spacing:1.5px;margin-bottom:30px;line-height:1.6;}
.nav-label{color:#555;font-size:9px;letter-spacing:1.5px;margin:20px 0 8px;}
.home-btn{
  display:block;width:100%;margin:14px 0 2px;padding:9px 10px;
  background:#141414;color:#bdbdbd;border:1px solid #2a2a2a;border-radius:7px;
  font-family:inherit;font-size:11.5px;cursor:pointer;text-align:left;
}
.home-btn:hover{background:#1d1d1d;color:var(--green);border-color:#3a3a3a;}
.nav button{
  display:block;width:100%;background:none;border:none;color:#8a8a8a;
  padding:10px 10px;text-align:left;border-radius:6px;cursor:pointer;font-size:13px;margin-bottom:2px;
}
.nav button:hover{background:#161616;color:#fff;}
.nav button.active{background:#171717;color:#fff;border-left:2px solid var(--green);}

/* 主区 */
.main{margin-left:240px;width:calc(100% - 240px);padding:34px 46px 90px;max-width:1420px;}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:34px;}
.page-title{font-size:11px;color:var(--muted);letter-spacing:2px;}
.profile{width:30px;height:30px;border:1px solid #333;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;}

.hero{margin-bottom:32px;}
.hero-label{color:var(--green);font-size:10px;letter-spacing:2px;margin-bottom:12px;}
.hero h1{font-size:clamp(28px,4vw,46px);line-height:1.05;letter-spacing:-1.5px;margin:0 0 16px;max-width:880px;}
.hero p{color:#8a8a8a;max-width:760px;font-size:13.5px;line-height:1.8;margin:0;}

.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:22px;margin-bottom:16px;}
.card-title{font-size:10px;letter-spacing:1.5px;color:#777;margin-bottom:16px;}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:start;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}

/* 信息表 */
.kv{display:flex;font-size:12.5px;padding:8px 0;border-bottom:1px solid #1d1d1d;}
.kv:last-child{border-bottom:none;}
.kv b{color:#777;font-weight:400;width:96px;flex:none;}
.kv span{color:#ddd;}

/* 标签 */
.tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:5px;border:1px solid #2c2c2c;color:#aaa;margin:2px 4px 2px 0;background:#161616;}
.tag.t-s{color:var(--green);border-color:rgba(183,255,74,.35);background:rgba(183,255,74,.07);}
.tag.t-a{color:var(--yellow);border-color:rgba(255,216,77,.3);background:rgba(255,216,77,.07);}
.tag.t-b{color:var(--blue);border-color:rgba(101,167,255,.3);background:rgba(101,167,255,.07);}
.tag.t-c{color:#999;}
.tag.t-d{color:#666;}

.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:700;}
.badge.s{background:rgba(183,255,74,.12);color:var(--green);border:1px solid rgba(183,255,74,.35);}
.badge.a{background:rgba(255,216,77,.12);color:var(--yellow);border:1px solid rgba(255,216,77,.3);}
.badge.b{background:rgba(101,167,255,.12);color:var(--blue);border:1px solid rgba(101,167,255,.3);}
.badge.c{background:#1c1c1c;color:#999;border:1px solid #2c2c2c;}
.badge.d{background:#141414;color:#666;border:1px solid #242424;}

.stars{color:var(--yellow);font-size:11px;letter-spacing:1px;}

/* 教师切换 */
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:20px;}
.seg button{background:none;border:none;color:#888;padding:9px 16px;font-size:12px;cursor:pointer;}
.seg button.on{background:#1e1e1e;color:#fff;}
.seg button:hover{color:#fff;}
.teacher-note{color:#7a7a7a;font-size:12px;line-height:1.75;margin:-6px 0 20px;max-width:820px;}

/* 课程切换 */
.course-seg{display:flex;flex-direction:column;gap:6px;margin-bottom:22px;}
.course-seg button{background:#101010;border:1px solid var(--border);color:#999;padding:10px 12px;border-radius:7px;font-size:12.5px;cursor:pointer;text-align:left;}
.course-seg button:hover{color:#fff;border-color:#444;}
.course-seg button.on{background:#1c1c1c;color:#fff;border-color:var(--green);}
.seg-term{font-size:10px;color:#555;letter-spacing:.14em;margin:10px 0 4px;text-transform:uppercase;}
.seg-term:first-child{margin-top:0;}
.seg-off{display:block;font-size:11.5px;color:#3d3d3d;padding:4px 12px;line-height:1.5;}
.cv-on{display:inline-block;color:var(--green);border:1px solid #24402c;background:#101a12;border-radius:6px;padding:3px 10px;margin:0 8px 6px 0;font-size:12px;text-decoration:none;}
.cv-on:hover{border-color:var(--green);}
.cv-on i{font-style:normal;color:#5f7a66;font-size:10px;margin-left:6px;}
.cv-off{display:inline-block;color:#4a4a4a;border:1px solid #1e1e1e;border-radius:6px;padding:3px 10px;margin:0 8px 6px 0;font-size:12px;}

/* 开屏主页 */
.landing{min-height:100vh;padding:64px 46px 90px;max-width:1260px;margin:0 auto;}
.lp-title{font-size:46px;font-weight:700;letter-spacing:-1.8px;margin:0;}
.lp-title span{color:var(--green);}
.lp-sub{color:#6d6d6d;font-size:12px;letter-spacing:2.4px;margin:12px 0 0;}
.lp-intro{color:#8a8a8a;font-size:13.5px;line-height:2;max-width:860px;margin:22px 0 36px;}
.lp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(318px,1fr));gap:16px;align-items:start;}
.lp-term{background:#0d0d0d;border:1px solid var(--border);border-radius:12px;padding:18px 18px 10px;}
.lp-term-h{font-size:11px;letter-spacing:1.8px;color:var(--green);margin-bottom:13px;}
.lp-course{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:#111;border:1px solid var(--border);color:#bbb;border-radius:8px;padding:11px 13px;margin-bottom:9px;cursor:pointer;font-size:13.5px;}
.lp-course b{font-weight:600;color:#eaeaea;}
.lp-course span{font-size:10.5px;color:#5f7a66;white-space:nowrap;}
.lp-course:hover{border-color:var(--green);background:#141a15;}
.lp-course.off{color:#4a4a4a;background:#0a0a0a;border-style:dashed;cursor:not-allowed;}
.lp-course.off:hover{border-color:#222;background:#0a0a0a;}
.lp-course.off b{color:#575757;}
.lp-course.off span{color:#3d3d3d;}
.lp-foot{color:#454545;font-size:11.5px;margin-top:34px;line-height:1.9;}
.backbar{background:none;border:1px solid var(--border);color:#8a8a8a;border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;}
.backbar:hover{color:#fff;border-color:#444;}
@media(max-width:900px){.landing{padding:40px 20px 70px;}.lp-title{font-size:32px;}}

/* 表格 */
.tbl{width:100%;border-collapse:collapse;}
.tbl th,.tbl td{text-align:left;border-bottom:1px solid #1f1f1f;padding:12px 8px;font-size:12.5px;vertical-align:top;}
.tbl th{color:#666;font-weight:400;font-size:10px;letter-spacing:1px;}
.tbl td{color:#ccc;}
.tbl tr:hover td{background:#131313;}

/* 章节手风琴 */
details.ch{background:var(--panel);border:1px solid var(--border);border-radius:10px;margin-bottom:12px;overflow:hidden;}
details.ch>summary{
  cursor:pointer;padding:18px 22px;list-style:none;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
details.ch>summary::-webkit-details-marker{display:none;}
details.ch>summary::before{content:"▸";color:var(--green);font-size:12px;transition:.15s;}
details.ch[open]>summary::before{transform:rotate(90deg);}
details.ch>summary h3{margin:0;font-size:15px;font-weight:600;}
details.ch>summary .en{color:#5a5a5a;font-size:11px;}
details.ch>summary .src{margin-left:auto;color:#555;font-size:10px;}
.ch-body{padding:4px 22px 22px;border-top:1px solid #1e1e1e;}
.sub-h{color:var(--green);font-size:10px;letter-spacing:1.5px;margin:18px 0 10px;}

.section-list{display:flex;flex-wrap:wrap;gap:6px;}
.section-list span{font-size:11px;color:#999;background:#151515;border:1px solid #222;padding:3px 9px;border-radius:5px;}

.concept{font-size:12.5px;line-height:1.75;color:#b8b8b8;padding:7px 0;border-bottom:1px solid #1a1a1a;}
.concept b{color:#e6e6e6;font-weight:600;}
.concept:last-child{border-bottom:none;}

.fml{display:grid;grid-template-columns:150px 1fr;gap:14px;padding:10px 0;border-bottom:1px solid #1a1a1a;align-items:baseline;}
.fml:last-child{border-bottom:none;}
.fml .fn{font-size:11.5px;color:#8a8a8a;line-height:1.6;}
.fml .ft{font-size:13px;color:#ddd;overflow-x:auto;overflow-y:hidden;}

/* 真题 */
.exam-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px;}
.exam-head h3{margin:0;font-size:16px;}
.q{border-top:1px solid #1e1e1e;padding:16px 0;}
.q-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px;}
.q-no{color:var(--green);font-size:12px;font-weight:700;flex:none;}
.q-title{font-size:13.5px;font-weight:600;}
.q-stem{font-size:12.5px;color:#b0b0b0;line-height:1.75;}
.q-fig{display:block;max-width:min(100%,420px);height:auto;margin:10px 0 2px;border:1px solid #2a2a2a;border-radius:6px;background:#fff;padding:4px;}
.paper-pages{margin-top:10px;border:1px solid #262626;border-radius:7px;padding:8px 10px;background:#101010;}
.paper-pages summary{cursor:pointer;color:#9a9a9a;font-size:12px;}
.paper-pages summary:hover{color:var(--green);}
.page-figs{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;margin-top:10px;}
.page-figs figure{margin:0;}
.page-figs a{display:block;border:1px solid #2a2a2a;border-radius:6px;background:#fff;overflow:hidden;}
.page-figs a:hover{border-color:var(--green);}
.page-figs img{display:block;width:100%;height:auto;max-height:420px;object-fit:contain;background:#fff;}
.pp-cap{display:block;font-size:10.5px;color:#777;margin-top:4px;}
.q-key{font-size:12px;color:#7f9a5f;line-height:1.7;margin-top:6px;}
.q-src{font-size:10.5px;color:#555;margin-top:8px;}

/* 冲刺 */
.plan .t{color:var(--green);font-size:22px;font-weight:700;}
.plan h3{font-size:13px;margin:12px 0 8px;}
.plan p{font-size:11.5px;color:#888;line-height:1.7;margin:0;}

/* 提示 */
.note{border-left:2px solid var(--green);padding:10px 16px;margin:14px 0;color:#9a9a9a;font-size:12px;line-height:1.75;}
.ev{border-left:2px solid #333;padding-left:14px;margin:8px 0;}
.ev div{font-size:11.5px;color:#aaa;margin-bottom:4px;}

@media (max-width:1000px){
  .sidebar{width:72px;padding:22px 8px;}
  .logo{font-size:15px;text-align:center;} .logo span{display:none;}
  .tagline,.nav-label{display:none;}
  .nav button{text-align:center;font-size:11px;padding:10px 3px;}
  .main{margin-left:72px;width:calc(100% - 72px);padding:22px;}
  .grid2,.cols,.grid4{grid-template-columns:1fr;}
  .grid3{grid-template-columns:1fr 1fr;}
  .fml{grid-template-columns:1fr;}
}
@media (max-width:640px){
  .grid3,.grid4{grid-template-columns:1fr;}
  .main{padding:16px;}
}
</style>

/* ============ 工具 ============ */
const R = String.raw;
const $ = (s)=>document.querySelector(s);
const esc = (s)=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
/* 把纯文本中的公式片段包成 $...$，交给 MathJax 以 LaTeX 行内公式渲染 */
const MATH_SEG = /[A-Za-z0-9\u0370-\u03ff\u2200-\u22ff\u2070-\u209f\u00b2\u00b3\u00b9\u00bd\u00bc\u00be\u221a\u222b\u222e\u2211\u2202\u2207\u00d7\u00b7\u00b1\u2248\u2260\u2264\u2265\u2192\u221e\u2080-\u2089\u2070-\u2079=+\-\u2212*/()\[\]{}^_|.,\s]+/g;
const HAS_MATH = /[=∫∮√∂∇∑×·±≈≠≤≥→∞²³¹⁰ⁿ½¼¾₀₁₂₃₄₅₆₇₈₉⁰¹²³⁴⁵⁶⁷⁸⁹_^\u0370-\u03ff\u2200-\u22ff]/;
function mathify(s){
  if(!s) return s;
  const tags=[];
  const shielded=String(s).replace(/<[^>]*>/g, m=>{
    tags.push(m); return `\u0000${tags.length-1}\u0000`;
  });
  const balanced = (c)=>{
    const same=(a,b)=>c.split(a).length===c.split(b).length;
    return same('{','}') && same('(',')') && same('[',']');
  };
  const out=shielded.replace(MATH_SEG, m=>{
    if(m.indexOf('$')>=0) return m;
    let core=m.trim();
    core=core.replace(/\^\(([^()]*)\)/g,'^{$1}').replace(/_\(([^()]*)\)/g,'_{$1}');
    if(core.length<2 || !HAS_MATH.test(core) || /[\u4e00-\u9fff]/.test(core)) return m;
    if(!/[A-Za-z0-9\u0370-\u03ff\u2200-\u22ff]/.test(core)) return m;
    if(/[_^](?![{A-Za-z0-9\u0370-\u03ff])/.test(core)) return m;
    if(!balanced(core)) return m;
    const pre=m.match(/^\s*/)[0], post=m.match(/\s*$/)[0];
    return `${pre}$${core}$${post}`;
  });
  return out.replace(/\u0000(\d+)\u0000/g, (_,i)=>tags[+i]);
}

/* ============ 课程信息（来自讲义第 I 章与真题卷面） ============ */

  src:'班型与成绩构成取自两位老师讲义：伯苓班＝胡金牛 chapter01.pdf（Quiz+Homework 40% + Final 60%）；大类班＝胡毅 A-绪论（原文「一、闭卷考试成绩（80%）二、平时成绩（20%）」）。课时、时长取自 2023–2024 期末试卷卷面（任课教师：胡金牛、胡毅）'
};

/* ============ 章节数据 ============ */
const CHAPTERS = [
{no:'I', title:'绪论', en:'Introduction', file:'chapter01.pdf',
 sections:['量子力学的起源','大事年表','黑体辐射','宇宙微波背景','光电效应','康普顿效应','物质的波动性','玻尔量子化条件','电子散射与布拉格定律','波动与波包','不确定度原理','电子双缝实验','概率与波函数','导出薛定谔方程','概率密度与连续性方程'],
 concepts:[
  ['量子力学的四条修正','宇宙不再决定论（只给概率）；光与物质都具波粒二象性；某些物理量只能取分立值（量子化）；观察者总会影响实验。'],
  ['黑体辐射','吸收所有入射辐射的理想物体（空心腔壁小孔）。经典瑞利–金斯公式在高频端发散（紫外灾难），普朗克以能量子 E=nhf 假设解决。'],

 formulas:[

{no:'1', title:'电磁现象的普遍规律', en:'郭硕鸿教材 · 第一章', file:'第1章.pdf（杨茂志）、第1章电磁现象的普遍规律.pdf（蔡卫）',
 sections:['电荷与电场（库仑定律、电场强度、高斯定理、静电场的无旋性）','电流与磁场（电流密度、电荷守恒、毕奥–萨伐尔定律、安培环路定理）','麦克斯韦方程组（法拉第定律、位移电流、方程组、洛伦兹力）','介质的电磁性质（极化、磁化、D 与 H、本构关系）','电磁场边值关系','电磁场的能量与能流（坡印廷矢量）','电磁场的动量（Maxwell 应力张量，蔡卫补充）'],
 concepts:[
  ['电磁场','物质存在的一种形态，用 E、B 两个矢量场描述；既有能量、动量，也能与带电物质相互作用。'],
  ['高斯定理与静电场的无旋性','∇·E=ρ/ε₀（电荷是电场的源，散度局域）；∇×E=0（保守场，可引入电势 E=−∇φ）。'],
  ['电荷守恒定律','∇·J+∂ρ/∂t=0，是电磁理论最基本的实验定律之一。'],
  ['磁场无源与安培环路定理','∇·B=0（无磁单极，可引入矢势 A）；∇×B=μ₀J。'],
  ['法拉第定律与位移电流','∇×E=−∂B/∂t（变化磁场激发有旋电场）；位移电流 J_D=ε₀∂E/∂t 使安培定律与电流守恒自洽，是电磁波脱离源传播的来源。'],
  ['麦克斯韦方程组','统一描述电荷电流激发电磁场以及电磁场自身运动；无源区预言电磁波，揭示电磁场可独立存在（物质性）。'],
  ['介质的极化与磁化','P 产生束缚电荷 ρ_P=−∇·P；M 产生磁化电流 J_M=∇×M；极化电流 J_P=∂P/∂t。'],
  ['D 与 H 及本构关系','D=ε₀E+P、H=B/μ₀−M；线性各向同性介质 D=εE、B=μH、J=σE。'],
  ['边值关系','法向 D、B 与切向 E、H 在介质界面上的跃变关系，由积分形式的麦氏方程推得。'],
  ['坡印廷矢量与能量传输','S=E×H；电磁能量通过电磁场（而非电流）传输。'],
  ['动量密度与 Maxwell 应力张量','g=S/c²；动量流密度为二阶张量 T，辐射压力是电磁场存在动量的证据。']
 ],
 formulas:[
  ['库仑定律', R`\vec F=\frac{1}{4\pi\varepsilon_0}\frac{QQ'}{r^{3}}\vec r`],
  ['高斯定理（积分/微分）', R`\oint_S\vec E\cdot d\vec S=\frac{1}{\varepsilon_0}\int_V\rho\,dV,\qquad \nabla\cdot\vec E=\frac{\rho}{\varepsilon_0}`],
  ['静电场的无旋性', R`\oint_L\vec E\cdot d\vec l=0,\qquad \nabla\times\vec E=0,\qquad \vec E=-\nabla\varphi`],
  ['电荷守恒（连续性方程）', R`\nabla\cdot\vec J+\frac{\partial\rho}{\partial t}=0`],
  ['毕奥–萨伐尔定律', R`\vec B=\frac{\mu_0}{4\pi}\int_V\frac{\vec J(\vec x')\times\vec r}{r^{3}}\,dV'`],
  ['安培环路定理与磁场散度', R`\nabla\times\vec B=\mu_0\vec J,\qquad \nabla\cdot\vec B=0,\qquad \vec B=\nabla\times\vec A`],
  ['法拉第定律', R`\oint_L\vec E\cdot d\vec l=-\frac{d}{dt}\int_S\vec B\cdot d\vec S,\qquad \nabla\times\vec E=-\frac{\partial\vec B}{\partial t}`],
  ['位移电流', R`\vec J_D=\varepsilon_0\frac{\partial\vec E}{\partial t}`],
  ['麦克斯韦方程组（真空，微分）', R`\nabla\times\vec E=-\frac{\partial\vec B}{\partial t},\quad \nabla\times\vec B=\mu_0\vec J+\mu_0\varepsilon_0\frac{\partial\vec E}{\partial t},\quad \nabla\cdot\vec E=\frac{\rho}{\varepsilon_0},\quad \nabla\cdot\vec B=0`],
  ['洛伦兹力', R`\vec f=\rho\vec E+\vec J\times\vec B,\qquad \vec F=q\vec E+q\vec v\times\vec B`],
  ['极化与束缚电荷', R`\vec P=\frac{\sum\vec p_i}{\Delta V},\qquad \rho_P=-\nabla\cdot\vec P,\qquad \vec J_P=\frac{\partial\vec P}{\partial t}`],
  ['磁化与磁化电流', R`\vec M=\frac{\sum\vec m_i}{\Delta V},\qquad \vec J_M=\nabla\times\vec M`],
  ['D 与 H', R`\vec D=\varepsilon_0\vec E+\vec P,\qquad \vec H=\frac{\vec B}{\mu_0}-\vec M`],
  ['介质中的麦克斯韦方程组', R`\nabla\times\vec E=-\frac{\partial\vec B}{\partial t},\quad \nabla\times\vec H=\vec J+\frac{\partial\vec D}{\partial t},\quad \nabla\cdot\vec D=\rho,\quad \nabla\cdot\vec B=0`],
  ['本构关系', R`\vec D=\varepsilon\vec E,\qquad \vec B=\mu\vec H,\qquad \vec J=\sigma\vec E`],
  ['边值关系', R`\hat e_n\times(\vec E_2-\vec E_1)=0,\quad \hat e_n\times(\vec H_2-\vec H_1)=\vec\alpha,\quad \hat e_n\cdot(\vec D_2-\vec D_1)=\sigma,\quad \hat e_n\cdot(\vec B_2-\vec B_1)=0`],
  ['坡印廷矢量与能量守恒', R`\vec S=\vec E\times\vec H,\qquad \nabla\cdot\vec S+\frac{\partial w}{\partial t}=-\vec f\cdot\vec v`],
  ['能量密度', R`w=\frac{1}{2}(\vec E\cdot\vec D+\vec H\cdot\vec B)`],
  ['动量密度', R`\vec g=\varepsilon_0\vec E\times\vec B=\frac{\vec S}{c^{2}}`],
  ['Maxwell 应力张量', R`\overleftrightarrow{T}=\frac{1}{2}\Big(\varepsilon_0E^{2}+\frac{1}{\mu_0}B^{2}\Big)\overleftrightarrow{I}-\varepsilon_0\vec E\vec E-\frac{1}{\mu_0}\vec B\vec B`]
 ]},

{no:'2', title:'静电场', en:'郭硕鸿教材 · 第二章', file:'第2章.pdf（杨茂志）、第2章静电场.pdf（蔡卫）',
 sections:['静电场的标势及其微分方程（泊松方程、边值关系、静电场能量）','唯一性定理','拉普拉斯方程与分离变量法','镜像法','格林函数法','电多极矩（电偶极矩、电四极矩、电荷体系在外场中的能量）'],
 concepts:[
  ['电势与泊松方程','E=−∇φ；线性均匀介质中 ∇²φ=−ρ/ε，无电荷区退化为拉普拉斯方程 ∇²φ=0。'],
  ['静电场边值关系','介质界面 φ₁=φ₂、ε₁∂φ₁/∂n−ε₂∂φ₂/∂n=σ；导体表面 φ=常量、ε∂φ/∂n=−σ。'],
  ['静电场能量','W=½∫E·D dV=½∫ρφ dV（注意 ½ρφ 不是能量密度）。'],
  ['唯一性定理','无导体时给定 ρ 与边界 φ 或 ∂φ/∂n 即唯一；有导体时给定各导体 φᵢ 或总电荷 Qᵢ，解唯一（镜像法、格林函数法的理论依据）。'],
  ['分离变量法','球坐标轴对称通解 φ=Σ(aₙRⁿ+bₙ/R^{n+1})Pₙ(cosθ)；典型题是介质球/接地导体球置于均匀外场。'],
  ['镜像法','在所求区域之外用假想电荷代替边界感应电荷；接地平面 Q′=−Q；接地导体球 b=R₀²/a、Q′=−(R₀/a)Q。'],
  ['格林函数','单位点电荷的电势，∇²G=−δ(x−x′)/ε₀；无界空间 G=1/(4πε₀|x−x′|)。'],
  ['电多极矩','φ=(1/4πε₀)[Q/R−p·∇(1/R)+(1/6)D:∇∇(1/R)+…]；电四极矩约化定义为无迹对称张量（5 个独立分量）。'],
  ['偶极子受外场力与力矩','F=∇(p·Eₑ)=p·∇Eₑ，L=p×Eₑ。']
 ],
 formulas:[
  ['电势与电场', R`\vec E=-\nabla\varphi,\qquad \varphi(P)=\sum_i\frac{Q_i}{4\pi\varepsilon_0 r_i}`],
  ['连续电荷分布电势', R`\varphi(x)=\int\frac{\rho(x')}{4\pi\varepsilon_0 r}\,dV'`],
  ['泊松方程与拉普拉斯方程', R`\nabla^{2}\varphi=-\frac{\rho}{\varepsilon},\qquad \nabla^{2}\varphi=0\ (\rho=0)`],
  ['介质界面边值关系', R`\varphi_1=\varphi_2,\qquad \varepsilon_1\frac{\partial\varphi_1}{\partial n}-\varepsilon_2\frac{\partial\varphi_2}{\partial n}=\sigma`],
  ['导体表面边界条件', R`\varphi=\text{常量},\qquad \varepsilon\frac{\partial\varphi}{\partial n}=-\sigma`],
  ['静电场能量', R`W=\frac12\int\vec E\cdot\vec D\,dV=\frac12\int\rho\varphi\,dV`],
  ['导体球能量（例）', R`W=\frac{Q^{2}}{8\pi\varepsilon_0 a}`],
  ['球坐标轴对称通解', R`\varphi=\sum_n\Big(a_nR^{n}+\frac{b_n}{R^{n+1}}\Big)P_n(\cos\theta)`],
  ['介质球在均匀外场中的电势', R`\varphi_1=-E_0R\cos\theta+\frac{\varepsilon-\varepsilon_0}{\varepsilon+2\varepsilon_0}\frac{E_0R_0^{3}\cos\theta}{R^{2}}`],
  ['介质球诱导偶极矩', R`p=\frac{\varepsilon-\varepsilon_0}{\varepsilon+2\varepsilon_0}\,4\pi\varepsilon_0R_0^{3}E_0`],
  ['接地平面镜像法', R`\varphi=\frac{1}{4\pi\varepsilon_0}\Big[\frac{Q}{\sqrt{x^{2}+y^{2}+(z-a)^{2}}}-\frac{Q}{\sqrt{x^{2}+y^{2}+(z+a)^{2}}}\Big]`],
  ['接地导体球镜像电荷', R`b=\frac{R_0^{2}}{a},\qquad Q'=-\frac{R_0}{a}Q`],
  ['格林函数', R`\nabla^{2}G(x,x')=-\frac{1}{\varepsilon_0}\delta(x-x'),\qquad G_{\text{无界}}=\frac{1}{4\pi\varepsilon_0|x-x'|}`],
  ['格林公式', R`\int_V[\psi\nabla^{2}\varphi-\varphi\nabla^{2}\psi]\,dV=\oint_S\Big(\psi\frac{\partial\varphi}{\partial n}-\varphi\frac{\partial\psi}{\partial n}\Big)dS`],
  ['多极展开式', R`\varphi(x)=\frac{1}{4\pi\varepsilon_0}\Big[Q/R-p\cdot\nabla(1/R)+\frac{1}{6}\sum_{i,j}D_{ij}\frac{\partial^{2}}{\partial x_i\partial x_j}(1/R)+\cdots\Big]`],
  ['电偶极矩与四极矩', R`\vec p=\int\rho(x')\vec x'\,dV',\qquad D_{ij}=\int(3x_i'x_j'-r'^{2}\delta_{ij})\rho(x')\,dV'`],
  ['均匀带电旋转椭球的电四极矩', R`D_{33}=\frac{2}{5}(a^{2}-b^{2})Q,\qquad D_{11}=D_{22}=-\frac{1}{5}(a^{2}-b^{2})Q`],
  ['偶极子在外场中的能量与受力', R`W^{(1)}=-\vec p\cdot\vec E_e,\qquad \vec F=\nabla(\vec p\cdot\vec E_e),\qquad \vec L=\vec p\times\vec E_e`]
 ]},

{no:'3', title:'静磁场', en:'郭硕鸿教材 · 第三章', file:'第3章.pdf（杨茂志）、第3章静磁场.pdf（蔡卫）',
 sections:['矢势及其微分方程（矢势、规范、边值关系、静磁场能量）','磁标势（引入条件、磁荷法、磁屏蔽）','磁多极矩（磁偶极子、在外场中的能量）','准静磁场（趋肤效应、扩散方程）','阿哈罗诺夫–玻姆效应'],
 concepts:[
  ['磁矢势 A','由 ∇·B=0 引入 B=∇×A；A 沿闭合回路的环量等于磁通量，只有环量有物理意义。'],
  ['规范任意性','A 与 A+∇ψ 对应同一磁场；最常用规范条件 ∇·A=0（库仑规范）。'],
  ['矢势微分方程','库仑规范下 ∇²A=−μJ（矢量泊松方程），特解 A=(μ/4π)∫J/r dV′。'],
  ['静磁场能量','W=½∫A·J dV（只对总能量成立，A·J/2 不是能量密度）。'],
  ['磁标势 φm','仅在无自由电流的单连通区域可引入 H=−∇φm；与静电场形式类比（ε→μ、E→H、P→M）。'],
  ['磁屏蔽','μ→∞ 的磁性物质表面为等磁势面；高磁导率球壳可屏蔽内部磁场。'],
  ['磁多极矩','A 的多极展开无磁单极项，最低阶为磁偶极子；m=½∫x′×J dV′（线圈 m=I∫dS）。'],
  ['磁偶极子在外场','U=−m·Bₑ，F=(m·∇)Bₑ，L=m×B。'],
  ['准静磁场与 A-B 效应','扩散方程 ∇²H=μσ∂H/∂t、趋肤深度 δ=√(2/ωμσ)；A-B 效应相位差 Δφ=(q/ℏ)∮A·dl。']
 ],
 formulas:[
  ['磁场基本方程', R`\nabla\times\vec H=\vec J,\qquad \nabla\cdot\vec B=0,\qquad \vec B=\nabla\times\vec A`],
  ['矢势环量', R`\int_S\vec B\cdot d\vec S=\oint_L\vec A\cdot d\vec l`],
  ['规范变换', R`\vec A'=\vec A+\nabla\psi,\qquad \nabla\cdot\vec A=0`],
  ['矢量泊松方程与特解', R`\nabla^{2}\vec A=-\mu\vec J,\qquad \vec A=\frac{\mu}{4\pi}\int\frac{\vec J(\vec x')}{r}\,dV'`],
  ['静磁场能量', R`W=\frac12\int\vec B\cdot\vec H\,dV=\frac12\int_V\vec A\cdot\vec J\,dV`],
  ['无穷长直导线的矢势与磁场', R`\vec A=-\frac{\mu_0I}{2\pi}\ln\frac{R}{R_0}\hat e_z,\qquad \vec B=\frac{\mu_0I}{2\pi R}\hat e_\varphi`],
  ['圆环电流远场（磁偶极子场）', R`\vec B=\frac{\mu_0}{4\pi}\frac{3(\vec m\cdot\hat r)\hat r-\vec m}{r^{3}},\qquad \vec m=I\pi a^{2}\hat z`],
  ['磁标势与假想磁荷', R`\vec H=-\nabla\varphi_m,\qquad \rho_m=-\mu_0\nabla\cdot\vec M`],
  ['磁标势边界条件', R`\varphi_1=\varphi_2,\qquad \mu_1\frac{\partial\varphi_1}{\partial n}=\mu_2\frac{\partial\varphi_2}{\partial n}`],
  ['磁偶极矩', R`\vec m=\frac12\int\vec x'\times\vec J\,dV',\qquad \vec m=I\int_S d\vec S`],
  ['磁偶极子矢势与标势', R`\vec A^{(1)}=\frac{\mu_0}{4\pi}\frac{\vec m\times\vec R}{R^{3}},\qquad \varphi_m^{(1)}=\frac{\vec m\cdot\vec R}{4\pi R^{3}}`],
  ['均匀磁化铁球内外场', R`\varphi_1=\frac{M_0R_0^{3}}{3}\frac{\cos\theta}{R^{2}},\qquad \vec H=-\frac13\vec M_0,\qquad \vec B=\frac23\mu_0\vec M_0`],
  ['磁偶极子在外场中的势能、力与力矩', R`U=-\vec m\cdot\vec B_e,\qquad \vec F=(\vec m\cdot\nabla)\vec B_e,\qquad \vec L=\vec m\times\vec B`],
  ['准静磁场扩散方程', R`\nabla^{2}\vec H=\mu\sigma\frac{\partial\vec H}{\partial t}`],
  ['趋肤深度', R`\delta=\sqrt{\frac{2}{\omega\mu\sigma}},\qquad H(z,t)=H_0e^{-z/\delta}\cos(z/\delta-\omega t)`],
  ['A-B 效应相位差', R`\Delta\phi=\frac{q}{\hbar}\oint\vec A\cdot d\vec l=\frac{q}{\hbar}\Phi`]
 ]},

{no:'4', title:'电磁波的传播', en:'郭硕鸿教材 · 第四章', file:'第4章.pdf（杨茂志）、第4章电磁波的传播.pdf（蔡卫）',
 sections:['平面电磁波（波动方程、时谐电磁波、亥姆霍兹方程、偏振、能量与能流）','介质界面上的反射与折射（菲涅耳公式、布儒斯特角、全反射）','有导体存在时的传播（复电容率、趋肤效应、导体表面反射）','谐振腔','波导'],
 concepts:[
  ['波动方程与光速','自由空间由麦氏方程导出齐次波动方程，c=1/√(μ₀ε₀)。'],
  ['时谐电磁波与亥姆霍兹方程','E=E(x)e^{−iωt}；∇²E+k²E=0（k=ω√(με)），须与 ∇·E=0 联立。'],
  ['平面波三条特性','① 横波（k·E=0）；② E⊥B 且 (k,E,B) 右手定则；③ E 与 B 同相，振幅比 E/B=1/√(με)=v。'],
  ['相速度与折射率','v=ω/k=1/√(με)，n=√(μᵣεᵣ)；ε=ε(ω) 引起色散。'],
  ['能流与时间平均','S=E×H=w·v·e_k；二次式求平均 ⟨fg⟩=½Re(f*g)。'],
  ['反射折射与菲涅耳公式','由界面边值关系得反射/折射定律与两组菲涅耳公式（TE/TM）。'],
  ['布儒斯特角与全反射','平行分量无反射时 tanθ_B=n₂/n₁；全反射临界角 sinθ_c=n₂/n₁，出现倏逝波。'],
  ['导体中的电磁波','复电容率 ε′=ε+iσ/ω，k=β+iα，良导体 α≈β≈√(ωμσ/2)，趋肤深度 δ=1/α。'],

 ],
 formulas:[

  ['平均能量密度与能流', R`\langle w\rangle=\frac12\varepsilon E_0^{2},\qquad \langle\vec S\rangle=\frac12\mathrm{Re}(\vec E\times\vec H^{*})=\langle w\rangle v\,\hat e_k`],

  ['复电容率与复波数', R`\varepsilon'=\varepsilon+i\frac{\sigma}{\omega},\qquad k=\beta+i\alpha,\qquad \beta^{2}-\alpha^{2}=\omega^{2}\mu\varepsilon,\qquad \alpha\beta=\frac12\omega\mu\sigma`],

{no:'5', title:'电磁波的辐射', en:'郭硕鸿教材 · 第五章', file:'第5章.pdf（杨茂志）、第5章电磁波的辐射.pdf（蔡卫）',
 sections:['电磁场的矢势和标势（规范变换、库仑规范、洛伦兹规范、达朗贝尔方程）','推迟势','电偶极辐射','磁偶极辐射与电四极辐射','天线辐射','电磁场的动量与辐射压力'],

  ['规范变换与规范不变性','A→A+∇ψ、φ→φ−∂ψ/∂t 描述同一电磁场；物理量与规律不变。'],
  ['库仑规范与洛伦兹规范','∇·A=0（横场，标势为库仑势）；∇·A+(1/c²)∂φ/∂t=0（势方程对称、协变）。'],
  ['达朗贝尔方程与推迟势','洛伦兹规范下 A、φ 的非齐次波动方程；其解为推迟势，场由较早时刻 t−r/c 的源决定，说明电磁作用传播有限。'],
  ['三个区域','近区（r≪λ，近似稳恒场）、感应区（r~λ）、远区/辐射区（r≫λ，横向电磁场）。'],
  ['电偶极辐射','远区为横波，角分布 ∝sin²θ，辐射功率 ∝ω⁴（瑞利散射）。'],
  ['磁偶极与电四极辐射','矢势展开第二项分解为磁偶极与电四极；功率 ∝(l/λ)⁴，比电偶极小。'],
  ['天线辐射','细直天线取驻波电流分布；半波天线 R_r≈73.2 Ω；天线阵通过干涉获得强方向性。'],
  ['辐射压力','动量密度 g=S/c²；理想导体全反射面压强 P=2wᵢcos²θ。']
 ],
 formulas:[
  ['势的定义', R`\vec B=\nabla\times\vec A,\qquad \vec E=-\nabla\varphi-\frac{\partial\vec A}{\partial t}`],

  ['库仑规范与洛伦兹规范', R`\nabla\cdot\vec A=0;\qquad \nabla\cdot\vec A+\frac{1}{c^{2}}\frac{\partial\varphi}{\partial t}=0`],
  ['达朗贝尔方程', R`\nabla^{2}\vec A-\frac{1}{c^{2}}\frac{\partial^{2}\vec A}{\partial t^{2}}=-\mu_0\vec J,\qquad \nabla^{2}\varphi-\frac{1}{c^{2}}\frac{\partial^{2}\varphi}{\partial t^{2}}=-\frac{\rho}{\varepsilon_0}`],

  ['电偶极辐射的矢势', R`\vec A(x)=\frac{\mu_0}{4\pi}\frac{e^{ikR}}{R}\dot{\vec p},\qquad \int_V\vec J\,dV'=\dot{\vec p}`],

  ['电偶极辐射能流（角分布）', R`\langle\vec S\rangle=\frac{|\ddot{\vec p}|^{2}}{32\pi^{2}\varepsilon_0c^{3}R^{2}}\sin^{2}\theta\,\hat e_R\propto\sin^{2}\theta`],
  ['电偶极辐射功率', R`P=\frac{|\ddot{\vec p}|^{2}}{12\pi\varepsilon_0c^{3}}=\frac{p_0^{2}\omega^{4}}{12\pi\varepsilon_0c^{3}}\propto\omega^{4}`],
  ['短天线辐射与辐射电阻', R`P=\frac{\pi}{12}\sqrt{\frac{\mu_0}{\varepsilon_0}}I_0^{2}\Big(\frac{l}{\lambda}\Big)^{2},\qquad R_r\approx197\Big(\frac{l}{\lambda}\Big)^{2}\ \Omega`],
  ['磁偶极矩与电四极矩', R`[m]=\frac12\int(\vec x'\times\vec J)\,dV',\qquad \mathcal D_{ij}=\int q(3x_ix_j-r^{2}\delta_{ij})\,dV'`],
  ['磁偶极辐射功率', R`P=\frac{|\ddot{\vec m}|^{2}}{12\pi\varepsilon_0c^{5}}\ \ (\text{由电偶极作}\ \vec p\to\vec m/c\ \text{代换})`],
  ['小电流线圈辐射', R`[m]=I_0\pi a^{2},\qquad P=\frac{4\pi^{5}}{3}Z_0\Big(\frac{a}{\lambda}\Big)^{4}I_0^{2}\propto\Big(\frac{a}{\lambda}\Big)^{4}`],
  ['半波天线辐射场与辐射电阻', R`B_\phi=-\frac{i\mu_0I_0e^{ikR}}{2\pi R}\frac{\cos(\frac{\pi\cos\theta}{2})}{\sin\theta},\qquad R_r\approx73.2\ \Omega`],
  ['天线阵调制因子', R`f=\frac{\sin^{2}(Nkl\cos\theta/2)}{\sin^{2}(kl\cos\theta/2)}`],
  ['电磁场动量密度与应力张量', R`\vec g=\varepsilon_0\vec E\times\vec B=\frac{\vec S}{c^{2}},\qquad T=-\varepsilon_0\vec E\vec E-\frac{1}{\mu_0}\vec B\vec B+\frac12\bar I\Big(\varepsilon_0E^{2}+\frac{1}{\mu_0}B^{2}\Big)`],
  ['辐射压力', R`P=2w_i\cos^{2}\theta=w\cos^{2}\theta,\qquad P_{\text{各向同性平均}}=\frac13w`]
 ]},

{no:'6', title:'狭义相对论', en:'郭硕鸿教材 · 第六章', file:'第6章.pdf（杨茂志）、第6章狭义相对论.pdf（蔡卫）',
 sections:['相对论的实验基础（迈克尔孙–莫雷实验、光速不变性）','相对论基本原理与洛伦兹变换（间隔不变性）','相对论时空理论（光锥、因果律、时钟延缓、尺度缩短、速度变换）','四维形式（四维协变量、物理规律的协变性）','电动力学的相对论不变性（四维电流/势、电磁场张量、麦氏方程协变形式）','相对论力学（能-动量四维矢量、质能关系、洛伦兹力）','带电粒子的拉格朗日量与哈密顿量（杨茂志）'],
 concepts:[
  ['两条基本原理','相对性原理（所有惯性系等价）＋光速不变原理（真空光速恒为 c，与光源运动无关）。'],
  ['间隔不变性','s²=c²t²−r² 不因参考系而变，是光速不变性的数学表示与相对论时空观的基础。'],
  ['洛伦兹变换','满足间隔不变的四维线性变换，反映相对论时空观（伽利略变换与之矛盾）。'],
  ['时空结构与因果律','s²>0 类时（光锥内）、s²=0 类光（光锥面）、s²<0 类空（光锥外）；c 是最大传播速度。'],
  ['时钟延缓与尺度缩短','Δt=γΔτ（固有时间）；l=l₀/γ（固有长度）。'],
  ['四维协变量','四维速度 U_μ、四维波矢量 k_μ、四维电流 J_μ、四维势 A_μ、电磁场张量 F_μν。'],
  ['电磁场张量','E 与 B 统一为反对称张量 F_μν；坐标变换时 E、B 可互相转化；有两个不变量 B²−E²/c² 与 B·E。'],
  ['质能关系','W₀=m₀c²；W²=p²c²+m₀²c⁴；质量亏损与结合能满足 ΔW=ΔM·c²。'],
  ['洛伦兹力的协变性','K_μ=eF_μνU_ν；低速过渡到牛顿定律。']
 ],
 formulas:[
  ['洛伦兹变换（正变换）', R`x'=\frac{x-vt}{\sqrt{1-v^{2}/c^{2}}},\quad y'=y,\quad z'=z,\quad t'=\frac{t-\frac{v}{c^{2}}x}{\sqrt{1-v^{2}/c^{2}}}`],
  ['间隔（不变量）', R`s^{2}=c^{2}t^{2}-r^{2},\qquad s'^{2}=s^{2}`],
  ['时间延缓与长度缩短', R`\Delta t=\frac{\Delta\tau}{\sqrt{1-v^{2}/c^{2}}}=\gamma\Delta\tau,\qquad l=\frac{l_0}{\gamma}`],
  ['相对论速度变换', R`u_x'=\frac{u_x-v}{1-\frac{vu_x}{c^{2}}},\qquad u_y'=\frac{u_y\sqrt{1-v^{2}/c^{2}}}{1-\frac{vu_x}{c^{2}}}`],
  ['斐索效应（运动介质中光速）', R`u_x=\frac{c/n+v}{1+\frac{v}{nc}}\approx\frac{c}{n}+\Big(1-\frac{1}{n^{2}}\Big)v`],
  ['四维波矢量与多普勒效应', R`k_\mu=\Big(\vec k,\frac{i\omega}{c}\Big),\qquad \omega'=\gamma\omega\Big(1-\frac{v}{c}\cos\theta\Big)`],
  ['四维电流与四维势', R`J_\mu=(\vec J,ic\rho),\qquad A_\mu=\Big(\vec A,\frac{i}{c}\varphi\Big),\qquad \Box A_\mu=-\mu_0J_\mu`],
  ['洛伦兹规范（协变）', R`\frac{\partial A_\mu}{\partial x_\mu}=\nabla\cdot\vec A+\frac{1}{c^{2}}\frac{\partial\varphi}{\partial t}=0`],
  ['电磁场张量', R`F_{\mu\nu}=\frac{\partial A_\nu}{\partial x_\mu}-\frac{\partial A_\mu}{\partial x_\nu}=\begin{pmatrix}0&B_3&-B_2&-\frac{iE_1}{c}\\-B_3&0&B_1&-\frac{iE_2}{c}\\B_2&-B_1&0&-\frac{iE_3}{c}\\\frac{iE_1}{c}&\frac{iE_2}{c}&\frac{iE_3}{c}&0\end{pmatrix}`],
  ['麦克斯韦方程的协变形式', R`\frac{\partial F_{\mu\nu}}{\partial x_\nu}=\mu_0J_\mu,\qquad \frac{\partial F_{\mu\nu}}{\partial x_\lambda}+\frac{\partial F_{\nu\lambda}}{\partial x_\mu}+\frac{\partial F_{\lambda\mu}}{\partial x_\nu}=0`],
  ['电磁场的变换关系', R`E_\parallel'=E_\parallel,\ \vec E_\perp'=\gamma(\vec E+\vec v\times\vec B)_\perp;\qquad B_\parallel'=B_\parallel,\ \vec B_\perp'=\gamma\Big(\vec B-\frac{\vec v}{c^{2}}\times\vec E\Big)_\perp`],
  ['电磁场不变量', R`B^{2}-\frac{1}{c^{2}}E^{2},\qquad \vec B\cdot\vec E`],
  ['四维动量与能量-动量关系', R`p_\mu=\Big(\vec p,\frac{i}{c}W\Big),\qquad W^{2}=p^{2}c^{2}+m_0^{2}c^{4}`],
  ['质能关系与质量亏损', R`W_0=m_0c^{2},\qquad \Delta W=\Delta M\,c^{2}`],
  ['洛伦兹力（协变）', R`K_\mu=eF_{\mu\nu}U_\nu,\qquad \vec F=e(\vec E+\vec v\times\vec B)`],
  ['拉格朗日量与正则动量', R`L=-m_0c^{2}\sqrt{1-\frac{v^{2}}{c^{2}}}-e(\varphi-\vec v\cdot\vec A),\qquad \vec P=\vec p+e\vec A`],
  ['哈密顿量', R`H=\sqrt{(\vec P-e\vec A)^{2}c^{2}+m_0^{2}c^{4}}+e\varphi`]
 ]},

   {no:'10', title:'麦克斯韦的两个基本假设', topic:'麦克斯韦方程组', type:'填空 · 3 分',

   {no:'11', title:'三种回路的安培环路定理', topic:'安培环路定理', type:'填空 · 3 分',
    stem:'两平行直导线通有方向相反的电流 I₀，求 A、B、C 三种环路情况下的安培环路定理 ∮H·dl 的值。（原卷配图如下）<img class="q-fig" src="img/em/em2018_fill5.png" alt="A、B、C 三个安培环路">',
    key:'按环路所围电流的代数和计算：A 围 +I₀、C 围 −I₀、B 同时围住两线（代数和为零）。', src:'填空题 5'},
   {no:'12', title:'感应电流的方向', topic:'电磁感应', type:'填空 · 3 分',
    stem:'将滑动变阻器的阻值提高，作出右边环路的感应电流的方向。（原卷配图如下）<img class="q-fig" src="img/em/em2018_fill6.png" alt="变阻器与右侧导线框">',
    key:'阻值增大→左侧电流减小→穿过右环的磁通量减小；由楞次定律，右环感应电流的磁场要维持原磁通，据此判断方向。', src:'填空题 6'},
   {no:'13', title:'导体平面与点电荷（镜像法）', topic:'镜像法·导体', type:'解答 · 13 分',
    stem:'无限大导体平面右侧距离为 d 处放置电荷 q，导体平面接地。求：(1) 右半空间（z≥0）的电势分布；(2) 导体平面上 A 点的电场分布；(3) A 点的极化电荷密度 σ_e；(4) 电荷 q 所受作用力。（原卷配图如下）<img class="q-fig" src="img/em/em2018_q1.png" alt="接地导体平面与点电荷 q">',
    key:'镜像电荷 −q 位于平面另一侧对称点；φ=(q/4πε₀)(1/r₁−1/r₂)；表面 E=σ/ε₀，F=q²/(16πε₀d²) 指向导体。', src:'解答题 1'},
   {no:'14', title:'球形电容器的双层介质', topic:'电介质·电容器', type:'解答 · 13 分',
    stem:'空间中有一球形电容器，内部极板和外壳为导体。两层导体之间填充了相对极化强度不同的电介质，分别为 ε₁、ε₂；内层极板上带电量 Q₀。求：(1) 电容器中电场强度 E 和电位移 D 的分布；(2) 内极板的电荷面密度 σ_e；(3) 该电容器的电容 C。（原卷配图如下）<img class="q-fig" src="img/em/em2018_q2.png" alt="球形电容器双层介质">',
    key:'由有介质高斯定理 D=Q₀/(4πr²)（两介质中相同），E=D/ε；两层串联，1/C=1/C₁+1/C₂。', src:'解答题 2'},
   {no:'15', title:'三支路直流电路', topic:'直流电路', type:'解答 · 12 分',
    stem:'如图所示电路，ε₁、ε₂、ε₃ 分别为 20V、10V、13V，内阻 r₁、r₂、r₃ 均为 1Ω，R₁、R₂、R₃ 分别为 6Ω、2Ω、4Ω。求：(1) 各支路的电流；(2) A、B 两点电势差 U_ab。（原卷配图如下）<img class="q-fig" src="img/em/em2018_q3.png" alt="三支路直流电路">',
    key:'设支路电流方向，列基尔霍夫节点与回路方程，解得三条支路电流，再由 U_ab=Σ(ε−Ir) 求电势差。', src:'解答题 3'},
   {no:'16', title:'带电圆盘与小线圈的互感', topic:'互感·磁场', type:'解答 · 13 分',
    stem:'有一带电圆盘由导线密绕而成，单位长度上的匝数为 n，半径为 R；距其 l 处有一小线圈，半径为 r，且 r≪l，小线圈处的磁场可近似为均匀。迎着 z 轴方向看，圆盘通有逆时针方向的电流 I。求：(1) 小线圈处的磁场 B₁；(2) 小线圈与圆盘的互感系数 M；(3) 若线圈通有 I=Kt 的电流，求小线圈的感应电动势 ε₂；(4) 小线圈由两种材料构成，一半为 ρ_A、一半 ρ_B，求感应电流 I₂；(5)（选做）求两段导线中的静电场 E_A0、E_B0。（原卷配图如下）<img class="q-fig" src="img/em/em2018_q4.png" alt="带电圆盘与小线圈">',
    key:'圆盘可看成一系列同心圆环叠加，B₁≈μ₀nIR²/[2(R²+l²)^{3/2}]；Φ=NB₁πr²，M=Φ/I；ε₂=−M dI/dt。', src:'解答题 4'},
   {no:'17', title:'两圆柱导体空腔的磁场', topic:'安培环路·叠加', type:'解答 · 13 分',
    stem:'如图，两个圆柱导体各挖去一部分后对接在一起，被挖掉的那一部分为真空。两导体通过的电流方向相反，电流密度大小为 j。已知两导体的磁导率等于真空磁导率 μ₀，求真空部分的磁感应强度分布。（原卷配图如下）<img class="q-fig" src="img/em/em2018_q5.png" alt="两圆柱导体对接与空腔">',
    key:'用叠加原理：完整圆柱（+j）与挖去圆柱（−j）的场相加；空腔内 B=μ₀j a/2（均匀场），方向垂直于两轴连线。', src:'解答题 5'}
  ]},

{ id:'dp2018', label:'大学物理（一）2017–2018 学年第二学期期末 A 卷 · 电磁学部分',
  meta:[['结构','填空 10 分（每空 1 分）＋ 10 道解答题×10 分；本套只收录电磁学题'],['备注','力学题（二、三、四、五）未收录'],['来源文件','2018.pdf（与 大物2017.pdf 内容相同）']],
  qs:[
   {no:'1', title:'麦克斯韦方程的积分形式', topic:'麦克斯韦方程组', type:'填空 · 4 分',
    stem:'分别写出能够体现下列每个结论的麦克斯韦方程组普适（基本）方程积分形式：变化的磁场可以产生电场：____；磁感应线是无头无尾的：____；电荷总伴随着电场：____；变化的电场可以产生磁场：____。',
    key:'∮E·dl=−dΦ_B/dt；∮B·dS=0；∮D·dS=Σq；∮H·dl=I_f+dΦ_D/dt。', src:'填空题 1'},
   {no:'2', title:'保持电源连接时充入介质', topic:'电介质·电容', type:'填空 · 2 分',
    stem:'一平行平板电容器充电后与电源保持连接，然后使两极板间充满相对介电常数为 ε_r 的各向同性均匀电介质。这时两极板上的电荷是原来的____倍，电场强度是原来的____倍。',
    key:'电压不变：Q=ε_rQ₀，E 不变。', src:'填空题 2'},
   {no:'3', title:'两类电流的微观本质', topic:'恒定电流', type:'填空 · 2 分',
    stem:'磁场都可以看作是电流激发的。从本质上讲电流可分为两类：一类是传导电流、运流电流及磁化电流，这类电流的微观本质是____；另一类是位移电流，其本质是____。',
    key:'前者是电荷的宏观/微观定向运动；后者是电场（电位移）随时间的变化。', src:'填空题 3'},
   {no:'4', title:'温差电效应的应用', topic:'恒定电流', type:'填空 · 2 分',
    stem:'写出温差电效应的两种主要应用：____和____。',
    key:'温差发电、热电偶测温（或电制冷）。', src:'填空题 4'},
   {no:'5', title:'带电直线的电势与场', topic:'电势·电场', type:'解答 · 10 分',
    stem:'长为 2a 的直线段上均匀地分布着电荷量为 q 的电荷，P 点在线段的垂直平分面上，离线段中点 O 的距离为 r。求 P 点的电势和 OP 方向上的电场强度分量。（原卷配图如下）<img class="q-fig" src="img/em/dp2018_q6.png" alt="带电直线与 P 点">',
    key:'U=(q/8πε₀a)ln[(√(a²+r²)+a)/(√(a²+r²)−a)]；E_r=−∂U/∂r=q/[4πε₀r√(a²+r²)]。', src:'解答题 六'},
   {no:'6', title:'同心球面的电场与电势', topic:'高斯定理·电势', type:'解答 · 10 分',
    stem:'两个同心导体球面的半径分别为 R₁ 和 R₂（R₁<R₂），各自带有电荷 Q₁ 和 Q₂，在两球面间充满相对介电常数为 ε_r 的电介质。求：(1) 内球面内部、两球面之间、外球面外部的电场强度矢量分布；(2) 上述各区域的电势分布；(3) 两球面间的电势差。',
    key:'分区域用高斯定理：r<R₁ 时 E=0；R₁<r<R₂ 时 E=Q₁/(4πε₀ε_r r²)；r>R₂ 时 E=(Q₁+Q₂)/(4πε₀r²)；U 分段积分。', src:'解答题 七'},
   {no:'7', title:'半圆柱面电流的磁场', topic:'毕奥—萨伐尔', type:'解答 · 10 分',
    stem:'如图所示（横截面图），半径为 R 的无限长半圆柱面导体，沿长度方向流有强度为 I 的电流，电流在柱面上均匀分布。求半圆柱面轴线 OO′ 上任一点的磁感应强度。（原卷配图如下）<img class="q-fig" src="img/em/dp2018_q8.png" alt="半圆柱面电流横截面">',
    key:'取窄条 dI=I dθ/π，dB=μ₀dI/(2πR)；沿半圆积分，垂直于对称面的分量抵消，B=μ₀I/(2π²R)，方向由右手定则确定。', src:'解答题 八'},
   {no:'8', title:'圆柱导体外包磁介质', topic:'安培环路·磁介质', type:'解答 · 10 分',
    stem:'一无限长圆柱形导体，半径为 R₁，其中均匀通过电流 I，方向如图。导体外紧包一层内外半径分别为 R₁ 和 R₂ 的圆柱筒顺磁介质，其相对磁导率为 μ_r。求：(1) 各区域磁场强度 H 的分布；(2) 不同区域磁感应强度 B 的分布；(3) 磁介质内磁化强度 M 的分布；(4) 磁介质内、外表面的磁化面电流密度。（导体的磁导率同真空）（原卷配图如下）<img class="q-fig" src="img/em/dp2018_q9.png" alt="圆柱导体与磁介质圆筒">',
    key:'由 ∮H·dl=I_free 得 H=I/(2πr)（r>R₁）；B=μ₀H（导体外、介质外）、B=μ₀μ_rH（介质内）；M=(μ_r−1)H。', src:'解答题 九'},
   {no:'9', title:'输电线回路与线框的互感', topic:'互感', type:'解答 · 10 分',
    stem:'一个输电回路可看成如图所示的两条平行长直载流导线，电流为 I、方向相反。这两根导线与旁边的长和宽分别为 a 和 b 的导线框共面，导线框上有 N 匝导线。求：(1) 两条平行长直载流导线输电回路与导线框之间的互感系数 M；(2) 设电流 I=I₀sinωt，求导线框中的感应电动势 ε。（原卷配图如下）<img class="q-fig" src="img/em/dp2018_q10.png" alt="两平行导线与矩形线框">',
    key:'B(r)=μ₀I/(2π)(1/r−1/(r+d))；Φ=∫B·dS 后乘 N，M=NΦ/I；ε=−M dI/dt=−M I₀ω cosωt。', src:'解答题 十'}
  ]},

    key:'r<R₁：E=q/(4πε₀ε_r r²)；R₁<r<R₂：E=0（导体）；r>R₂：E=q/(4πε₀r²)；U 分段积分，注意导体等势。', src:'解答题 六'},

   {no:'8', title:'圆柱形磁场与棒 AB 的感生电动势', topic:'感生电动势', type:'解答 · 10 分',
    stem:'均匀磁场 B 被限制在圆心为 O、半径 R 的无限长圆柱空间内，方向垂直纸面向里。设磁场以 dB/dt=c 的匀速率增加，问：(1) 任意半径 r 处感应电场的大小；(2) 磁场外棒 AB 上的感生电动势，并判断感应电动势的方向。已知 AB=OA=OB=l。（原卷配图如下）<img class="q-fig" src="img/em/dp2019_q8.png" alt="圆柱形磁场与棒 AB">',

   {no:'4', title:'含 cos ax/(x²+1)² 的实积分', topic:'留数', type:'计算 · 10 分', stem:'求解积分 ∫_{−∞}^{+∞} cos ax/(x²+1)² dx，并分别讨论 a>0 与 a<0 的情况。', key:'取上半平面围道，z=±i 为二阶极点；I=2πi Res[e^{iaz}/(z²+1)², i]= (π/2)(1+|a|)e^{−|a|}；a<0 时由偶函数性对称。', src:'一·4'},

   {no:'7', title:'勒让德多项式与球谐函数', topic:'特殊函数', type:'计算/证明 · 10 分', stem:'(1) 求 ∫_{−1}^{1}P_l(x)dx；(2) 已知 f(x)=x³，求其在勒让德多项式下的展开；(3) 证明球谐函数的正交性。', key:'(1) l=0 时为 2，l≥1 时为 0（奇偶性）。(2) x³=(2/5)P₃+(3/5)P₁。(3) 用球谐函数的显式表达式与 ∫P_l^mP_{l′}^m dx 的正交性证明。', src:'三·1'},
   {no:'8', title:'接地导体球与点电荷', topic:'静电场', type:'计算 · 10 分', stem:'在点电荷 q 的电场中放置接地导体球，球半径为 a，球心与点电荷相距 r₁（r₁>a），求静电场。已知勒让德多项式母函数展开式。', key:'镜像法：在球内 r=a²/r₁ 处放镜像电荷 q′=−qa/r₁；球外电势为原电荷与镜像电荷之和，用母函数展开成勒让德级数，验证 r=a 处为零。', src:'三·2'},
   {no:'9', title:'柱坐标薛定谔方程分离变量', topic:'分离变数', type:'计算 · 10 分', stem:'在柱坐标系下将定态薛定谔方程分离变量，并求出对应方程的本征值和本征解，其中 Z(±∞) 有限、Φ 满足自然边界条件。(1) 求 Z 和 Φ；(2) 求 R 的方程；(3) 令 v=√ρ R(ρ)，求 v 满足的方程。', key:'设 ψ=R(ρ)Φ(φ)Z(z)；Φ″+m²Φ=0 → Φ=e^{imφ}，m 为整数；Z″−k²Z=0，有限性给出 k=0 或指数衰减；R 满足贝塞尔型方程，代换 v=√ρR 化为标准贝塞尔方程。', src:'三·3'},
   {no:'10', title:'约瑟夫森结（附加题）', topic:'数理方程应用', type:'推导 · 10 分', stem:'由双态薛定谔方程 iℏ∂_t(Ψ₁,Ψ₂)ᵀ=(eV,K;K,−eV)(Ψ₁,Ψ₂)ᵀ 出发：(1) 推导约瑟夫森方程 I=I₀sinφ、∂φ/∂t=2eV/ℏ；(2) 直流电压 U₀ 下求 I(t) 与周期 T，并说明 U₀=0 时仍存在电流；(3) 交流电压 V=U₀sinωt 下求 I(t)，证明频谱为 nω 谐波叠加，系数含贝塞尔函数 J_n(k)。', key:'(1) 代入振幅与相位，分离实虚部得相位演化与电流正比于 sinφ。(2) φ=φ₀+2eU₀t/ℏ，I=I₀sin(φ₀+ω_J t)，T=πℏ/(eU₀)；U₀=0 时 φ 恒定，仍有直流超导电流。(3) 用 sin(k sinωt) 与 cos(k sinωt) 的贝塞尔展开，得各阶谐波。', src:'三·4'}
  ]},

   {no:'8', title:'三类方程与三类边界条件', topic:'数理方程', type:'简答 · 20 分', stem:'写出三类泛定方程及三类边界条件，并解释方程和边界条件齐次与非齐次的概念。', key:'波动 u_tt=a²∇²u、输运 u_t=a²∇²u、稳定场 ∇²u=0；三类边界为给定函数值、法向导数、二者线性组合；齐次指不含外源/边界驱动项。', src:'3.1'},
   {no:'9', title:'球函数分离变量', topic:'分离变数', type:'计算 · 20 分', stem:'已知 u_tt=a²Δu−ω²u，边界条件 u|_{r=r₀}=g(θ)e^{iωt}、u|_{r=0} 有限。(1) 用分离变数法求出各变数的常微分方程；(2) 写出问题的解。', key:'设 u=R(r)Y(θ,φ)T(t)，角向得球谐方程，径向得球贝塞尔方程；由 r=0 有限与边界条件定系数。', src:'3.2'},
   {no:'10', title:'柱函数分离变量', topic:'分离变数', type:'计算 · 20 分', stem:'已知 u_t=a²∇²u，柱坐标下分离变量。(1) 分离变量；(2) 解出 T(t)，用自然边界条件解出 Φ(φ)；(3) 上下底面第二类齐次边界条件下的解；(4) 侧面第一类齐次边界条件下的解；(5) 边界 u|_{r=r₀}=g(φ) 时的一般柱内解。', key:'T=e^{−a²λ²t}，Φ=e^{imφ}；Z 由上下底面边界定 k；R 为零阶贝塞尔函数，系数由侧面边界与广义傅里叶展开确定。', src:'3.3'}

function renderLanding(){

    const items = sec.courses.map(name=>{

}

function COURSE_INFO_ROWS(){
  const C = courseOf();
  const rows = [];
  const kv = (k,v)=>rows.push(`<div class="kv"><b>${k}</b><span>${v}</span></div>`);
  const cn = COURSE_NAME[CID];
  const term = cn ? (CURRICULUM.find(s=>s.courses.indexOf(cn)>=0)||{}).term : null;
  kv('课程', esc(C.name));
  kv('开课学期', term ? `${esc(term)} · 物理科学学院` : '—');
  kv('教材', esc(C.textbook||'—'));
  kv('教师', CID==='qm'
      ? `伯苓班：胡金牛；大类班：胡毅`
      : esc(C.teachers||'—'));
  if(CID==='qm'){
    kv('成绩构成', `伯苓班：${C.gradeBailing}<br>大类班：${C.gradeDalei}`);
  } else {
    kv('成绩构成', esc(C.grade||'—'));
  }
  kv('卷面构成', esc(C.paper||'—'));
  rows.push(`<div class="kv" style="align-items:flex-start"><b>来源</b><span style="color:#777;font-size:12px">${esc(C.src)}</span></div>`);
  rows.push(`<div class="kv" style="align-items:flex-start"><b>参考教材</b><span style="color:#777;font-size:12px">${C.refs.map(esc).join('；')}</span></div>`);
  return rows.join('');
}

function chCard(c, open, prefix){
  return `
  <details class="ch" ${open?'open':''}>
    <summary>
      <h3>${prefix}${esc(c.title)}</h3>
      <span class="en">${esc(c.en)}</span>
      <span class="src">${esc(c.file)}</span>
    </summary>
    <div class="ch-body">
      <div class="sub-h">小节</div>
      <div class="section-list">${c.sections.map(s=>`<span>${esc(s)}</span>`).join('')}</div>
      <div class="sub-h">核心概念</div>
      ${c.concepts.map(([t,d])=>`<div class="concept"><b>${esc(t)}</b>：${mathify(esc(d))}</div>`).join('')}
      <div class="sub-h">重要公式</div>
      ${c.formulas.map(([n,t])=>`<div class="fml"><div class="fn">${esc(n)}</div><div class="ft">\\[${esc(t)}\\]</div></div>`).join('')}
    </div>
  </details>`;
}
